    <text x="970.0" y="221" font-size="12" fill="#e8eef5" font-weight="400" text-anchor="middle">[Software System]</text>
    <text x="970.0" y="249" font-size="14" fill="white" font-weight="400" text-anchor="middle">Cliente de desarrollo</text>
  </g>
  <g id="github">
    <rect x="60" y="440" width="240" height="130" rx="5" fill="#64748b" />
    <text x="180.0" y="478" font-size="18" fill="white" font-weight="600" text-anchor="middle">GitHub</text>
    <text x="180.0" y="501" font-size="12" fill="#e8eef5" font-weight="400" text-anchor="middle">[Software System]</text>
    <text x="180.0" y="529" font-size="14" fill="white" font-weight="400" text-anchor="middle">Repositorios y</text>
    <text x="180.0" y="549" font-size="14" fill="white" font-weight="400" text-anchor="middle">colaboración</text>
  </g>
  <g id="plataforma">
    <rect x="420" y="430" width="360" height="150" rx="5" fill="#1168bd" />
    <text x="600.0" y="468" font-size="19" fill="white" font-weight="600" text-anchor="middle">AWS Cloud Consultant Agent</text>
    <text x="600.0" y="491" font-size="12" fill="#e8eef5" font-weight="400" text-anchor="middle">[Software System]</text>
    <text x="600.0" y="519" font-size="14" fill="white" font-weight="400" text-anchor="middle">Sistema multiagente para</text>
    <text x="600.0" y="539" font-size="14" fill="white" font-weight="400" text-anchor="middle">proyectos de nube</text>
  </g>
