  <line x1="60" y1="881" x2="1140" y2="881" stroke="#dce3eb" />
  <rect x="60" y="900" width="12" height="12" rx="2" fill="#08427b" />
  <text x="81" y="911" font-size="12" fill="#526178" font-weight="400" text-anchor="start">Persona interna</text>
  <rect x="285" y="900" width="12" height="12" rx="2" fill="#686868" />
  <text x="306" y="911" font-size="12" fill="#526178" font-weight="400" text-anchor="start">Persona externa</text>
  <rect x="510" y="900" width="12" height="12" rx="2" fill="#1168bd" />
  <text x="531" y="911" font-size="12" fill="#526178" font-weight="400" text-anchor="start">Sistema en estudio</text>
  <rect x="795" y="900" width="12" height="12" rx="2" fill="#64748b" />
  <text x="816" y="911" font-size="12" fill="#526178" font-weight="400" text-anchor="start">Sistema externo</text>
