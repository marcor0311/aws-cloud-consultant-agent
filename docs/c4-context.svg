    <circle cx="600.0" cy="704" r="26" fill="#686868" />
    <text x="600.0" y="768" font-size="18" fill="white" font-weight="600" text-anchor="middle">Cliente</text>
    <text x="600.0" y="791" font-size="12" fill="#e8eef5" font-weight="400" text-anchor="middle">[Person]</text>
    <text x="600.0" y="819" font-size="14" fill="white" font-weight="400" text-anchor="middle">Participa en proyectos</text>
    <text x="600.0" y="839" font-size="14" fill="white" font-weight="400" text-anchor="middle">de nube</text>
