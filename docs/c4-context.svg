    <text x="230.0" y="221" font-size="12" fill="#e8eef5" font-weight="400" text-anchor="middle">[Software System]</text>
    <text x="230.0" y="249" font-size="14" fill="white" font-weight="400" text-anchor="middle">Cliente conversacional</text>
  </g>
