<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="1200" height="930" role="img" aria-labelledby="title description" font-family="Arial, Helvetica, sans-serif" style="max-width:100%;height:auto;background:white">
  <title id="title">AWS Cloud Consultant Agent: contexto C4 nivel 1</title>
  <desc id="description">El equipo usa ChatGPT o Claude y Codex o Claude Code para consumir el sistema multiagente por MCP. El sistema utiliza las API de GitHub y Google. El cliente gestiona sus reuniones con el sistema.</desc>
  <rect width="1200" height="930" fill="white" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#526178" />
    </marker>
  </defs>
  <text x="60" y="47" font-size="25" fill="#172b4d" font-weight="600" text-anchor="start">AWS Cloud Consultant Agent</text>
  <text x="60" y="73" font-size="14" fill="#526178" font-weight="400" text-anchor="start">C4 nivel 1: contexto objetivo</text>
  <line x1="60" y1="94" x2="1140" y2="94" stroke="#dce3eb" />
  <path d="M490,225 L360,225" fill="none" stroke="#526178" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="425" y="209" font-size="13" fill="#526178" font-weight="400" text-anchor="middle">Solicita asistencia</text>
  <path d="M710,225 L840,225" fill="none" stroke="#526178" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="775" y="209" font-size="13" fill="#526178" font-weight="400" text-anchor="middle">Trabaja en proyectos</text>
  <path d="M230,290 L230,352 L510,352 L510,430" fill="none" stroke="#526178" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="370" y="334" font-size="13" fill="#526178" font-weight="400" text-anchor="middle">Solicita acciones de consultoría</text>
  <text x="370" y="369" font-size="12" fill="#526178" font-weight="400" text-anchor="middle">[MCP]</text>
  <path d="M970,290 L970,352 L690,352 L690,430" fill="none" stroke="#526178" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="830" y="334" font-size="13" fill="#526178" font-weight="400" text-anchor="middle">Solicita acciones de consultoría</text>
  <text x="830" y="369" font-size="12" fill="#526178" font-weight="400" text-anchor="middle">[MCP]</text>
  <path d="M420,505 L300,505" fill="none" stroke="#526178" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="360" y="469" font-size="13" fill="#526178" font-weight="400" text-anchor="middle">Gestiona</text>
  <text x="360" y="487" font-size="13" fill="#526178" font-weight="400" text-anchor="middle">artefactos</text>
  <text x="360" y="522" font-size="12" fill="#526178" font-weight="400" text-anchor="middle">[API]</text>
  <path d="M780,505 L900,505" fill="none" stroke="#526178" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="840" y="469" font-size="13" fill="#526178" font-weight="400" text-anchor="middle">Integra servicios</text>
  <text x="840" y="487" font-size="13" fill="#526178" font-weight="400" text-anchor="middle">de Google</text>
  <text x="840" y="522" font-size="12" fill="#526178" font-weight="400" text-anchor="middle">[API]</text>
  <path d="M600,678 L600,580" fill="none" stroke="#526178" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="618" y="633" font-size="13" fill="#526178" font-weight="400" text-anchor="start">Solicita servicios de consultoría</text>
