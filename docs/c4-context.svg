    <text x="1020.0" y="501" font-size="12" fill="#e8eef5" font-weight="400" text-anchor="middle">[Software System]</text>
    <text x="1020.0" y="529" font-size="14" fill="white" font-weight="400" text-anchor="middle">Servicios de Google</text>
  </g>
  <g id="cliente">
