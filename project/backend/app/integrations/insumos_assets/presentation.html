<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>@@TITLE@@</title>
  <style>
/* === OFFLINE TYPOGRAPHY === */
@font-face{font-family:Lato;src:url(data:font/ttf;base64,@@FONT_REGULAR@@) format('truetype');font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:Lato;src:url(data:font/ttf;base64,@@FONT_BOLD@@) format('truetype');font-style:normal;font-weight:700 900;font-display:swap}
/* === NO NAME / CORPORATE EDITORIAL === */
:root{--stage-bg:#e9edf1;--slide-bg:#fff;--ink:#152536;--muted:#526171;--line:#ced8e2;--paper:#f4f7fa;--blue:#244cdd;--orange:#df713c}
*{box-sizing:border-box}body{font-family:Lato,sans-serif;color:var(--ink)}button{font:inherit}
@@VIEWPORT_CSS@@
.slide{padding:65px 110px 78px;transition:opacity .24s ease}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:23px;height:58px;position:relative;z-index:3}
header .brand{display:flex;align-items:center;gap:15px;font-size:29px;letter-spacing:-.5px}.brand svg{width:31px;height:31px}header>span{font-size:20px;color:var(--muted)}
.slide-content{position:relative;isolation:isolate;height:800px;padding-top:51px}
.kicker{font-size:18px;letter-spacing:.13em;font-weight:700;color:var(--blue);margin-bottom:23px}
h2{font-size:83px;line-height:1.07;letter-spacing:-.037em;font-weight:700;margin:0 0 49px;max-width:1660px}
h3{font-size:36px;line-height:1.16;margin:22px 0 18px;letter-spacing:-.02em}p{margin:0}
footer{position:absolute;left:110px;right:110px;bottom:48px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:18px;font-size:17px;letter-spacing:.04em;color:var(--muted);z-index:3}footer b{font-size:22px;font-weight:400;letter-spacing:0;color:var(--ink)}
.body-copy{font-size:28px;line-height:1.5;color:var(--muted);max-width:660px}.large-copy{font-size:44px;line-height:1.3;letter-spacing:-.02em;margin-bottom:35px;max-width:690px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:105px;align-items:start}.bottom-note{margin-top:38px;padding:23px 0 0;border-top:1px solid var(--line);font-size:27px;line-height:1.4;color:var(--muted)}
/* Title image is reserved for this running event */
.hero header{border:0}.hero .kicker{margin-top:65px}.hero h2{font-size:124px;line-height:1.02;max-width:880px;margin:36px 0 0;letter-spacing:-.05em}
.hero-sub{font-size:32px;line-height:1.5;max-width:730px;margin-top:55px;color:#3d5269}.hero-photo{position:absolute;left:-110px;top:-123px;width:1920px;height:1080px;max-width:none;max-height:none;object-fit:cover;z-index:-2;pointer-events:none;transform-origin:68% 50%}
.hero-accent{width:90px;height:5px;background:var(--orange);margin-top:34px;transform-origin:left}.hero-lines{position:absolute;inset:0;background:linear-gradient(120deg,#fff 50%,#eef3f9);z-index:-2}
.hero.visible .hero-photo{animation:photo-arrive .9s cubic-bezier(.2,.7,.2,1) both}.hero.visible .hero-accent{animation:line-arrive .6s .2s ease both}
/* Executive synthesis: investment, date and accountability in one view */
.executive-purpose{font-size:22px;line-height:1.35;color:var(--muted);margin-bottom:22px}.executive-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:55px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0 27px;margin-bottom:25px}.executive-facts span{font-size:21px;color:var(--muted);display:block;margin-bottom:13px}.executive-facts strong{font-size:49px;letter-spacing:-.03em;line-height:1.15;font-weight:400}.executive-reading p{display:grid;grid-template-columns:310px 1fr;gap:35px;font-size:27px;line-height:1.35;padding:14px 0}.executive-reading b{font-weight:700}.executive-reading span{color:var(--muted)}.executive-note{font-size:22px;line-height:1.4;color:var(--muted);margin-top:18px}
/* Experience: intent on the left, concrete steps on the right */
.journey-row{display:flex;gap:30px;align-items:center;padding:27px 0;border-top:1px solid var(--line);font-size:30px;line-height:1.3}.journey-row b{font-size:21px;flex:0 0 42px;color:var(--blue)}.journey-row:last-child{border-bottom:1px solid var(--line)}
.three-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:60px;margin-top:60px}.three-cols article{border-top:1px solid var(--line);padding-top:24px}.index{font-size:24px;color:var(--blue)}.three-cols p{font-size:29px;line-height:1.45;color:var(--muted)}
/* System diagram: each lane is a responsibility, the arrows are the content flow */
.system-intro{font-size:30px;color:var(--muted);line-height:1.4;max-width:1350px;margin-bottom:45px}.system-diagram{display:grid;grid-template-columns:repeat(3,1fr);gap:95px;position:relative}.system-diagram article{position:relative;border-top:4px solid var(--blue);padding-top:25px;min-height:230px}.system-diagram article:last-child{border-color:var(--orange)}.system-diagram article:not(:last-child):after{content:'→';position:absolute;right:-68px;top:70px;font-size:48px;color:var(--muted)}.system-diagram span{font-size:22px;color:var(--muted)}.system-diagram h3{font-size:37px}.system-diagram p{font-size:28px;color:var(--muted);line-height:1.45}
/* Two planning figures; the historical reference has a separate reading level */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:100px}.metric{border-top:1px solid var(--line);padding-top:20px}.metric>span{font-size:24px;color:var(--muted)}.metric strong{display:block;font-size:143px;line-height:1.04;letter-spacing:-.06em;margin:13px 0 17px;color:var(--blue)}.metric p{font-size:29px;line-height:1.3}.metric small{font-size:23px;line-height:1.45;color:var(--muted);display:block;max-width:690px;margin-top:16px}.historical{font-size:21px;line-height:1.45;color:var(--muted);margin-top:20px;max-width:1450px}.metrics~.bottom-note{color:var(--ink);font-size:28px}
.quality-grid{border-top:1px solid var(--line)}.quality-row{display:grid;grid-template-columns:355px 1fr;gap:65px;padding:29px 0;border-bottom:1px solid var(--line)}.quality-row b{font-size:30px;line-height:1.25}.quality-row p{font-size:29px;line-height:1.4;color:var(--muted);max-width:1120px}
.numbered p{display:flex;gap:28px;font-size:31px;line-height:1.4;padding:0 0 29px;margin-bottom:24px;border-bottom:1px solid var(--line)}.numbered b{font-size:22px;flex:0 0 40px;color:var(--blue)}.statement{padding:10px 0 0 40px;border-left:3px solid var(--blue)}.statement span{font-size:21px;color:var(--muted)}.statement strong{display:block;font-size:54px;line-height:1.18;margin-top:27px;letter-spacing:-.03em;font-weight:400;max-width:590px}
.roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:60px;margin-top:45px}.roadmap article{border-top:1px solid var(--line);padding-top:24px}.roadmap b{font-size:54px;color:var(--blue)}.roadmap h3{font-size:33px;line-height:1.3;max-width:490px}.roadmap p{font-size:28px;line-height:1.4;color:var(--muted)}
.closing{display:grid;grid-template-columns:1fr 1fr;gap:110px}.deliverable-stack p{border-top:1px solid var(--line);padding:25px 0;font-size:32px;line-height:1.3;display:flex;gap:24px}.deliverable-stack span{font-size:20px;flex:0 0 40px;color:var(--blue);padding-top:8px}.owners p{font-size:27px;line-height:1.4;color:var(--muted);margin-bottom:22px}.owners b{display:block;font-size:29px;color:var(--ink);margin-bottom:7px}.closing-note{border-top:1px solid var(--line);padding-top:22px;margin-top:27px;font-size:24px;line-height:1.4;color:var(--muted)}
.reveal{opacity:0;transform:translateY(12px);transition:opacity .3s ease,transform .3s ease}.visible .reveal{opacity:1;transform:translateY(0)}.visible .reveal:nth-child(2){transition-delay:.04s}.visible .reveal:nth-child(3){transition-delay:.08s}
@keyframes photo-arrive{from{opacity:0;transform:translateX(30px) scale(1.015)}to{opacity:1;transform:translateX(0) scale(1)}}@keyframes line-arrive{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.deck-controls{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:5px;font-size:13px;opacity:.2;transition:opacity .2s}.deck-controls:hover,.deck-controls:focus-within{opacity:1}.deck-controls button{background:#fff;color:var(--ink);border:0;width:40px;height:30px;cursor:pointer}.deck-controls button:hover{background:var(--paper)}.deck-controls button:disabled{opacity:.3}.counter{min-width:66px;text-align:center}.deck-progress{position:fixed;bottom:0;left:0;height:3px;background:var(--blue);z-index:1000;transition:width .2s}
.edit-hotzone{position:fixed;top:0;left:0;width:90px;height:65px;z-index:1001}.edit-toggle{position:fixed;top:14px;left:14px;opacity:0;pointer-events:none;z-index:1002;border:1px solid var(--line);padding:9px 15px;background:white;cursor:pointer}.edit-toggle.show,.edit-toggle.active{opacity:1;pointer-events:auto}.editing [data-edit-id]{outline:2px dashed var(--blue);outline-offset:5px;white-space:pre-line}.edit-hint{display:none;position:fixed;top:14px;left:110px;background:#fff;padding:10px;border:1px solid var(--line);z-index:1002;font-size:13px}.editing .edit-hint{display:block}:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
@media(prefers-reduced-motion:reduce){.hero-photo,.hero-accent{animation:none!important}.slide,.reveal,.deck-progress{transition:none!important;transition-delay:0s!important}}
@media print{@page{size:1920px 1080px;margin:0}.reveal{opacity:1!important;transform:none!important}.hero-photo{animation:none!important;opacity:1!important;transform:none!important}.deck-progress,.edit-hotzone,.edit-toggle,.edit-hint{display:none!important}}
  </style>
</head>
<body>
  <div class="deck-viewport"><main class="deck-stage" id="deckStage" aria-label="Presentación ejecutiva">@@SLIDES@@</main></div>
  <nav class="deck-controls" aria-label="Navegación de diapositivas">
    <button id="prev" aria-label="Anterior">←</button><span class="counter" id="counter" aria-live="polite"></span><button id="next" aria-label="Siguiente">→</button>
  </nav>
  <div class="deck-progress" id="progress" aria-hidden="true"></div>
  <div class="edit-hotzone" aria-hidden="true"></div><button class="edit-toggle" id="editToggle" title="Editar textos (E)">Editar</button><span class="edit-hint">Edición local / Ctrl/Cmd + S guarda una copia HTML</span>
  <script>
/* === LOCAL TEXT EDITING === */
class TextEditor {
  constructor(){
    this.active=false;this.storageSlot='@@STORAGE_KEY@@';this.nodes=[...document.querySelectorAll('[data-edit-id]')];
    try{const saved=JSON.parse(localStorage.getItem(this.storageSlot)||'{}');this.nodes.forEach(n=>{if(typeof saved[n.dataset.editId]==='string')n.textContent=saved[n.dataset.editId];});}catch{}
    this.nodes.forEach(n=>n.addEventListener('input',()=>{try{localStorage.setItem(this.storageSlot,JSON.stringify(Object.fromEntries(this.nodes.map(x=>[x.dataset.editId,x.innerText]))));}catch{}}));
    const toggle=document.querySelector('#editToggle');toggle.addEventListener('click',()=>this.toggle());
    let delay;const zone=document.querySelector('.edit-hotzone');
    for(const el of [zone,toggle]){el.addEventListener('mouseenter',()=>{clearTimeout(delay);toggle.classList.add('show');});el.addEventListener('mouseleave',()=>{delay=setTimeout(()=>{if(!this.active)toggle.classList.remove('show');},400);});}
  }
  toggle(){this.active=!this.active;document.body.classList.toggle('editing',this.active);document.querySelector('#editToggle').classList.toggle('active',this.active);this.nodes.forEach(n=>n.contentEditable=String(this.active));}
  save(){const clone=document.documentElement.cloneNode(true);clone.querySelector('body').classList.remove('editing');clone.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));clone.querySelector('#editToggle').classList.remove('active','show');const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='presentacion-editada.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
}
/* === FIXED STAGE AND PRESENTATION CONTROLLER === */
class SlidePresentation {
  constructor(){
    this.slides=[...document.querySelectorAll('.slide')];this.stage=document.querySelector('#deckStage');this.current=0;this.editor=new TextEditor();
    this.scale=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);this.stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;};this.scale();addEventListener('resize',this.scale);
    document.querySelector('#prev').onclick=()=>this.show(this.current-1);document.querySelector('#next').onclick=()=>this.show(this.current+1);
    addEventListener('keydown',event=>{
      if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();this.editor.save();return;}
      if(event.target.isContentEditable)return;
      if(event.key.toLowerCase()==='e'){this.editor.toggle();return;}
      if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)){event.preventDefault();this.show(this.current+1);}
      if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();this.show(this.current-1);}
      if(event.key==='Home')this.show(0);if(event.key==='End')this.show(this.slides.length-1);
    });
    let startX=0;addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(this.editor.active)return;const distance=e.changedTouches[0].clientX-startX;if(Math.abs(distance)>55)this.show(this.current+(distance<0?1:-1));},{passive:true});
    let last=0;addEventListener('wheel',e=>{if(this.editor.active||Date.now()-last<650||Math.abs(e.deltaY)<20)return;last=Date.now();this.show(this.current+(e.deltaY>0?1:-1));},{passive:true});
    addEventListener('hashchange',()=>this.show(Number(location.hash.slice(1))-1));this.show(Number(location.hash.slice(1))-1||0);
  }
  show(index){this.current=Math.max(0,Math.min(Number.isFinite(index)?index:0,this.slides.length-1));this.slides.forEach((slide,i)=>{const active=i===this.current;slide.classList.toggle('active',active);slide.classList.toggle('visible',active);slide.setAttribute('aria-hidden',String(!active));slide.inert=!active;});document.querySelector('#counter').textContent=`${String(this.current+1).padStart(2,'0')} / ${String(this.slides.length).padStart(2,'0')}`;document.querySelector('#prev').disabled=this.current===0;document.querySelector('#next').disabled=this.current===this.slides.length-1;document.querySelector('#progress').style.width=`${(this.current+1)/this.slides.length*100}%`;if(location.protocol!=='about:')history.replaceState(null,'',`#${this.current+1}`);}
}
window.presentation=new SlidePresentation();
  </script>
</body>
</html>
