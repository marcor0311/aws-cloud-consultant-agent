[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-assistant"
version = "1.0.0"
description = "Agent 1: Calendar Assistant for Engagement Manager scheduling"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[mcp]~=1.8.9",
    "livekit-plugins-ai-coustics~=0.3",
    "mcp>=2.2,<3",
    "python-dotenv",
    "google-api-python-client>=2.180,<3",
    "google-auth-oauthlib>=1.2,<2",
    "dateparser>=1.4,<2",
    "text2num>=3,<4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
