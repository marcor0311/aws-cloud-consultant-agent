[models]
whisper = "mlx-community/whisper-small-mlx"
ollama = "qwen3:1.7b-q4_K_M"
ollama_url = "http://127.0.0.1:11434"
voice = "ef_dora"
tts_speed = 1.05
torch_threads = 4

[conversation]
system_prompt = """
Eres un asistente de voz que conversa en español con naturalidad.
Responde de forma breve, normalmente en una o dos frases, sin markdown ni listas.
Usa el contexto de la conversación y no inventes datos que no conozcas.
Los datos y el nombre del usuario pertenecen al usuario, no a ti.
En preguntas sobre lo conversado, responde únicamente con datos explícitos del historial.
Si falta un dato, pide aclaración en lugar de inventarlo.
Si el usuario te interrumpe, atiende su nueva indicación.
"""
context_tokens = 4096
max_response_tokens = 160
temperature = 0.2
history_turns = 6
history_characters = 6000
phrase_min_characters = 35
phrase_max_characters = 160

[vad]
threshold = 0.55
release_threshold = 0.35
onset_ms = 96
silence_ms = 480
pre_roll_ms = 160
min_speech_ms = 256
max_utterance_seconds = 20

[audio]
# -1: dispositivo predeterminado de macOS; voice-call devices muestra los índices.
input_device = -1
output_device = -1
queue_frames = 32
# auto: voz con auriculares; con altavoces, espera a terminar y permite cortar con Enter.
barge_in_mode = "auto"
echo_tail_ms = 350

[metrics]
directory = "outputs"
sample_seconds = 0.5
