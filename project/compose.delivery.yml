services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: ${DELIVERY_POSTGRES_PASSWORD:?Define DELIVERY_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - delivery-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  delivery-data:
