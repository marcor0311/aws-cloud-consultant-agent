name: Entrega 1 local
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: delivery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DELIVERY_TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/delivery_test
      LANGSMITH_TRACING: "false"
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-delivery.lock
      - run: python -m ruff check app/delivery tests/test_delivery.py
      - run: python -m ruff format --check app/delivery tests/test_delivery.py
      - run: python -m pytest tests -q
